_schema-version: 3.3.0
ID: student-app
description: A simple CAP project.
version: 1.0.0
modules:
  - name: student-app-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: student-app-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: student-app-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: student-app-db
    parameters:
      buildpack: nodejs_buildpack

  - name: student-app
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: student-app-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production
        - mkdir -p gen/srv/app/studentsui
        - cp -r app/students-ui/webapp/. gen/srv/app/studentsui/